<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Klaverjassen — Amsterdam Rules</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0a5730" />
<style>
  :root{   /* Theme A · Grand Casino (default) */
    --felt:#0b6b3a;--felt2:#0a5730;--felt3:#063d22;--gold:#e8c766;--card:#fbfbf5;--red:#c62828;--black:#1c1c1c;
    --panel:#0e2a1d;--panelbd:#1c4a34;--txt:#eaf3ec;--dim:#9ab6a6;--we:#5db3ff;--they:#ff9d6b;
    --body:#06301c;--btn:#0a3d27;--btnhov:#0e4c31;--goldink:#241f08;
    --pop:#07281bf5;--pophov:#0e4c3155;--ltbg:#04180e;--logbg:#0a3d2755;--backbd:#ffffff55;
    --roembg:#3a300f88;--dealbg:#0a2c4655;--natbg:#4a1414aa;
    --cardbk:repeating-linear-gradient(45deg,#123f8a,#123f8a 5px,#1b53b0 5px,#1b53b0 10px);
  }
  :root[data-theme="b"]{   /* Bruine Kroeg */
    --felt:#6b4a2b;--felt2:#5a3d24;--felt3:#3f2b18;--gold:#c99a3c;--card:#f3e9d2;--red:#a3241d;--black:#2a1e14;
    --panel:#2b2018;--panelbd:#4a3720;--txt:#f4e8cf;--dim:#bb9d78;--we:#7fb0e0;--they:#e0a06b;
    --body:#3a2817;--btn:#4a3720;--btnhov:#5c4527;--goldink:#26200c;
    --pop:#2b2018f7;--pophov:#5c452766;--ltbg:#241a12;--logbg:#4a372055;--backbd:#c99a3c66;
    --roembg:#4a3a1288;--dealbg:#26384e66;--natbg:#4a201aaa;
    --cardbk:repeating-linear-gradient(45deg,#7a2620,#7a2620 5px,#8f2d24 5px,#8f2d24 10px);
  }
  :root[data-theme="b"] #table{background:
    repeating-linear-gradient(91deg,#5a3d24 0,#5a3d24 5px,#573a22 5px,#573a22 11px),
    linear-gradient(180deg,#6b4a2b,#4a3018)}
  :root[data-theme="c"]{   /* Dark Mode */
    --felt:#1a1c22;--felt2:#141519;--felt3:#0f0e0c;--gold:#e7c877;--card:#1d2431;--red:#ff6b6b;--black:#e6edf3;
    --panel:#12161c;--panelbd:#29323f;--txt:#e6edf3;--dim:#8b949e;--we:#6cb2ff;--they:#ffab7a;
    --body:#0e0f12;--btn:#1b212b;--btnhov:#242c38;--goldink:#26200c;
    --pop:#161b22f7;--pophov:#242c3866;--ltbg:#12161c;--logbg:#1b212b66;--backbd:#e7c87766;
    --roembg:#3a320f88;--dealbg:#16324e66;--natbg:#4a1a1aaa;
    --cardbk:repeating-linear-gradient(45deg,#26221a,#26221a 5px,#332c1f 5px,#332c1f 10px);
  }
  :root[data-theme="c"] #table{background:radial-gradient(120% 95% at 50% 0%,#26262a 0%,#0f0e0c 60%)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--body);color:var(--txt)}
  #app{display:flex;height:100%;min-height:100vh}
  #tablewrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
  #topbar{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--panelbd);flex-wrap:wrap}
  .score{display:flex;align-items:center;gap:8px;font-weight:600}
  .pill{padding:3px 10px;border-radius:999px;font-size:13px;background:var(--btn);border:1px solid var(--panelbd)}
  .we{color:var(--we)} .they{color:var(--they)}
  #roomPill{font-weight:800;letter-spacing:2px}
  .tbtn{background:var(--btn);color:var(--txt);border:1px solid var(--panelbd);border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .tbtn:hover{background:var(--btnhov)}.tbtn.on{background:var(--gold);color:var(--goldink);border-color:var(--gold)}
  .gearwrap{position:relative}
  .pop{position:absolute;top:calc(100% + 7px);right:0;left:auto;z-index:60;width:186px;max-width:calc(100vw - 16px);background:var(--pop);border:1px solid var(--panelbd);border-radius:12px;box-shadow:0 14px 30px #0009;padding:8px;display:none}
  .pop.open{display:block}
  .pop-hd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:4px 6px 8px}
  .pop-row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;color:var(--txt);font-size:12.5px;font-weight:600}
  .pop-row:hover{background:var(--pophov)}
  .pop-row .pi{width:16px;text-align:center;opacity:.85}
  .switch{margin-left:auto;position:relative;width:38px;height:21px;flex:none;padding:0;background:var(--btn);border:1px solid var(--panelbd);border-radius:999px;cursor:pointer;transition:background .18s,border-color .18s}
  .switch::after{content:"";position:absolute;top:50%;left:3px;width:15px;height:15px;border-radius:50%;background:var(--dim);transform:translateY(-50%);transition:transform .18s,background .18s}
  .switch[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
  .switch[aria-checked="true"]::after{transform:translate(17px,-50%);background:var(--goldink)}
  .switch:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .pop-sep{height:1px;background:var(--panelbd);margin:6px 4px}
  .theme-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 6px;border:0;background:none;color:var(--txt);font:600 12.5px/1 inherit;border-radius:8px;cursor:pointer;font-family:inherit}
  .theme-opt:hover{background:var(--pophov)}
  .theme-opt .sw{width:16px;height:16px;border-radius:5px;flex:none;border:1px solid #0004;box-shadow:inset 0 0 0 1px #ffffff22}
  .theme-opt .chk{margin-left:auto;color:var(--gold);opacity:0;font-weight:800}
  .theme-opt[aria-checked="true"]{background:var(--pophov)}
  .theme-opt[aria-checked="true"] .chk{opacity:1}
  .theme-opt:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  #trumpBadge{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px}
  #trumpSym{font-size:26px;line-height:1}
  #table{flex:1;position:relative;background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt2) 70%,var(--felt3) 100%);overflow:hidden;min-height:460px}
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;transition:filter .2s}
  .seat .name{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:#0009;border:1px solid #ffffff22;white-space:nowrap}
  .seat.turn .name{background:var(--gold);color:#222;box-shadow:0 0 14px var(--gold)}
  .seat.dealer .name::after{content:" (D)";color:var(--gold)}
  .seat.off .name{opacity:.5;font-style:italic}
  #sp-2{top:10px;left:50%;transform:translateX(-50%)}
  #sp-1{left:14px;top:50%;transform:translateY(-50%)}
  #sp-3{right:14px;top:50%;transform:translateY(-50%)}
  #sp-0{bottom:8px;left:50%;transform:translateX(-50%)}
  .teamtag{font-size:10px;letter-spacing:.5px;opacity:.8}
  .backrow{display:flex}.backrow.vert{flex-direction:column}
  .cardback{width:34px;height:48px;border-radius:5px;background:var(--cardbk);border:1px solid var(--backbd);margin-left:-20px;box-shadow:0 1px 3px #0006}
  .backrow.vert .cardback{margin-left:0;margin-top:-34px}
  .backrow .cardback:first-child,.backrow.vert .cardback:first-child{margin:0}
  #slots,#trick{position:absolute;inset:0;pointer-events:none}
  #slots{display:none;z-index:2}
  #trick{z-index:36}   /* played cards always visible above seats & the cheat panel */
  #trick .tcard,#slots .tslot{position:absolute}
  .tslot{width:58px;height:82px;border-radius:7px;background:#ffffff30;border:2px dashed #ffffff90;box-sizing:border-box}
  .tcard{transition:all .25s ease}
  .pos-0{left:50%;top:50%;transform:translate(-50%,calc(-50% + 58px))}.pos-2{left:50%;top:50%;transform:translate(-50%,calc(-50% - 58px))}
  .pos-1{left:50%;top:50%;transform:translate(calc(-50% - 68px),-50%)}.pos-3{left:50%;top:50%;transform:translate(calc(-50% + 68px),-50%)}
  .tcard.mine{box-shadow:0 0 0 2px var(--gold),0 3px 10px #0008}
  /* last-trick recap (bottom-right) — mini mirror of the trick, same viewer orientation */
  #lasttrick{position:absolute;right:12px;bottom:12px;width:124px;height:108px;z-index:35;
     background:var(--ltbg);border:1px solid var(--panelbd);border-radius:10px;box-shadow:0 4px 14px #0006}
  #lasttrick.empty{display:none}
  #lasttrick .ltlbl{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.5px;
     color:var(--dim);background:var(--ltbg);padding:0 6px;white-space:nowrap;text-transform:uppercase}
  .ltcard{position:absolute;width:30px;height:42px;border-radius:4px;background:var(--card);color:var(--black);
     border:1px solid #0003;box-shadow:0 1px 3px #0005;display:flex;align-items:center;justify-content:center;
     font-weight:800;font-size:13px;user-select:none}
  .ltcard.red{color:var(--red)}
  .ltcard.ltwin{box-shadow:0 0 0 2px var(--gold),0 1px 3px #0007}  /* winning card ring (gold, not green) */
  .lt-0{left:50%;bottom:3px;transform:translateX(-50%)}
  .lt-2{left:50%;top:11px;transform:translateX(-50%)}
  .lt-1{left:3px;top:calc(50% + 3px);transform:translateY(-50%)}
  .lt-3{right:3px;top:calc(50% + 3px);transform:translateY(-50%)}
  .card{width:58px;height:82px;border-radius:7px;background:var(--card);color:var(--black);border:1px solid #0003;box-shadow:0 2px 5px #0005;position:relative;user-select:none;display:flex;align-items:center;justify-content:center;font-weight:800}
  .card .rk{position:absolute;top:3px;left:5px;font-size:15px;line-height:1}
  .card .rk.b{top:auto;left:auto;bottom:3px;right:5px;transform:rotate(180deg)}
  .card .big{font-size:30px}.card.red{color:var(--red)}
  #handbar{background:var(--panel);border-top:1px solid var(--panelbd);padding:12px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
  #hand{display:flex;justify-content:center;flex-wrap:wrap;gap:0}
  #hand .card{width:66px;height:94px;margin-left:-14px;cursor:default;transition:transform .12s,box-shadow .12s;border-radius:8px}
  #hand .card:first-child{margin-left:0}#hand .card .big{font-size:34px}
  #hand .card.legal{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 3px 8px #0007}
  #hand .card.legal:hover{transform:translateY(-16px)}
  #hand .card.illegal{filter:brightness(.6) saturate(.6)}
  #handlabel{font-size:12px;color:var(--dim);min-height:16px;text-align:center}
  #roemcall:empty{display:none}
  #linkbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:70;max-width:calc(100vw - 32px);background:var(--natbg);color:var(--txt);border:1px solid var(--panelbd);border-radius:10px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 6px 18px #0008;display:none}
  #linkbar.show{display:block}
  .pop-act{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 6px;border:0;background:none;color:var(--txt);font:600 12.5px/1 inherit;border-radius:8px;cursor:pointer;font-family:inherit}
  .pop-act:hover{background:var(--btnhov)}
  #roemcall .btn{padding:6px 14px;font-size:13px}
  #side{width:290px;background:var(--panel);border-left:1px solid var(--panelbd);display:flex;flex-direction:column}
  #side h1{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid var(--panelbd)}
  #side h1 small{display:block;font-size:11px;color:var(--dim);font-weight:400}
  #log{flex:1;overflow:auto;padding:10px 12px;font-size:12.5px;line-height:1.5}
  #log .entry{padding:5px 8px;border-radius:6px;margin-bottom:5px;background:var(--logbg);border-left:3px solid var(--panelbd)}
  #log .entry.roem{border-left-color:var(--gold);background:var(--roembg)}
  #log .entry.deal{border-left-color:var(--we);background:var(--dealbg)}
  #log .entry.nat{border-left-color:var(--red);background:var(--natbg)}
  #log .entry b{color:var(--gold)}
  #rulesbtn{margin:0;border:0;border-top:1px solid var(--panelbd);background:var(--btn);color:var(--txt);padding:9px;cursor:pointer;font-size:12px}#rulesbtn:hover{background:var(--btnhov)}
  #toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--goldink);font-weight:800;padding:8px 18px;border-radius:999px;box-shadow:0 4px 16px #0008;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:40;font-size:14px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
  #toast.err{background:#d24b4b;color:#fff}
  .overlay{position:absolute;inset:0;background:#02150cd0;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--panelbd);border-radius:14px;padding:22px 26px;max-width:460px;width:100%;box-shadow:0 12px 40px #000a;text-align:center}
  .modal h2{margin:0 0 6px;font-size:20px}.modal p{margin:4px 0 16px;color:var(--dim);font-size:13.5px;line-height:1.5}
  .field{display:flex;flex-direction:column;gap:5px;text-align:left;margin:10px 0}
  .field label{font-size:12px;color:var(--dim);font-weight:600}
  .field input{background:var(--pop);border:1px solid var(--panelbd);border-radius:8px;color:var(--txt);padding:10px 12px;font-size:15px}
  .field input:focus{outline:none;border-color:var(--gold)}
  .row2{display:flex;gap:10px}.row2 input{flex:1;text-transform:uppercase;letter-spacing:2px;font-weight:700}
  .btn{background:var(--gold);color:var(--goldink);border:0;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px #0006}
  .btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sec{background:var(--btn);color:var(--txt);border:1px solid var(--panelbd);font-weight:600}
  .btn.wide{width:100%;margin-top:6px}
  .sep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:14px 0}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--panelbd)}
  .suitbtns{display:flex;gap:12px;justify-content:center}
  .suitbtn{width:66px;height:84px;border-radius:10px;background:var(--card);border:2px solid transparent;font-size:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,border-color .1s;box-shadow:0 3px 8px #0006}
  .suitbtn:hover{transform:translateY(-6px);border-color:var(--gold)}.suitbtn.red{color:var(--red)}.suitbtn.black{color:var(--black)}
  .summary{text-align:left;font-size:13.5px;line-height:1.7;background:var(--logbg);border-radius:10px;padding:12px 16px;margin:8px 0 16px}
  .summary .row{display:flex;justify-content:space-between}.summary .big{font-size:16px;font-weight:800}
  .win{color:#7ee0a0}.lose{color:#ff8a8a}
  /* lobby seat picker */
  .lobbyseats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .lseat{border:1px solid var(--panelbd);border-radius:10px;padding:12px;background:var(--logbg);cursor:pointer;transition:border-color .1s}
  .lseat:hover{border-color:var(--gold)}
  .lseat.mine{border-color:var(--gold);background:#3a300f55}
  .lseat.taken{cursor:default;opacity:.9}
  .lseat .pos{font-size:11px;color:var(--dim)}.lseat .who{font-weight:700;font-size:14px;margin-top:3px}
  .lseat.t0 .pos{color:var(--we)}.lseat.t1 .pos{color:var(--they)}
  .codebig{font-size:34px;font-weight:900;letter-spacing:8px;color:var(--gold);margin:2px 0}
  .diffrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px}
  .difflbl{font-size:12px;color:var(--dim);font-weight:600}
  .diffbtns{display:flex;gap:6px}
  .diffbtn{background:var(--btn);color:var(--txt);border:1px solid var(--panelbd);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .diffbtn:hover:not(:disabled){background:var(--btnhov)}
  .diffbtn.on{background:var(--gold);color:var(--goldink);border-color:var(--gold)}
  .diffbtn:disabled{cursor:default;opacity:.85}
  .seatlvls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .seatlvls label{font-size:11px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:4px}
  .lvlsel{background:var(--btn);color:var(--txt);border:1px solid var(--panelbd);border-radius:7px;padding:4px 6px;font-size:12px;font-weight:700}
  .lseat .lvl{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:6px}
  #cheat{position:absolute;left:10px;bottom:10px;z-index:35;width:250px;background:var(--pop);border:1px solid var(--panelbd);border-radius:10px;padding:9px 11px 10px;box-shadow:0 6px 20px #0007;font-size:12px}
  #cheat.hidden{display:none}
  .cheat-hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12.5px;color:var(--gold);margin-bottom:7px}
  .cheat-hd .x{cursor:pointer;color:var(--dim);font-weight:700}.cheat-hd .x:hover{color:#fff}
  .cheat-row{display:flex;align-items:center;gap:6px;margin:4px 0}
  .cheat-row .lbl{width:44px;font-size:11px;font-weight:700;color:var(--dim);flex:none}.cheat-row .lbl.tr{color:var(--gold)}
  .tiles{display:flex;gap:3px;flex:1}
  .tile{flex:1;background:var(--card);color:var(--black);border-radius:4px;text-align:center;padding:2px 0 3px;line-height:1.05;box-shadow:0 1px 2px #0005}
  .tile.red{color:var(--red)}.tile .r{font-size:12px;font-weight:800;display:block}.tile .v{font-size:9.5px;font-weight:700;opacity:.7;display:block}.tile.zero .v{opacity:.4}
  .cheat-arrow{font-size:9px;color:var(--dim);margin:2px 0 0 48px}
  .cheat-roem{margin-top:8px;padding-top:7px;border-top:1px solid var(--panelbd);font-size:10.5px;line-height:1.5;color:var(--dim)}.cheat-roem b{color:var(--txt)}
  #ruleText{text-align:left;font-size:13px;line-height:1.6;max-height:66vh;overflow:auto}
  #ruleText h3{color:var(--gold);margin:12px 0 4px;font-size:14px}
  table.vt{border-collapse:collapse;font-size:12px;margin:4px 0}table.vt td{border:1px solid var(--panelbd);padding:2px 7px;text-align:center}
  @media(max-width:900px){#side{display:none}#cheat{width:210px}}
  /* phones: compact 2-row topbar + on-screen popover anchored to the whole bar */
  @media(max-width:600px){
    #topbar{position:relative;gap:7px 9px;padding:7px 10px}
    #topbar .pill{padding:3px 8px;font-size:12px}
    #topbar .score{gap:5px;font-size:12.5px}
    #topbar .tm{display:none}
    #trumpBadge{margin-left:0;font-size:13px}
    .gearwrap{position:static}
    .pop{top:calc(100% + 6px);right:8px;width:min(240px,calc(100vw - 16px))}
  }
</style>
<script>(function(){try{var t=localStorage.getItem('kj_theme');if(t==='b'||t==='c')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <div id="tablewrap">
    <div id="topbar">
      <span class="pill" id="roomPill">—</span>
      <div class="score"><span id="weLbl" class="we">We</span><span class="pill we" id="scoreWe">0</span></div>
      <div class="score"><span id="theyLbl" class="they">They</span><span class="pill they" id="scoreThey">0</span></div>
      <span class="pill" id="dealPill" style="display:none">Deal <b id="dealNo">1</b>/16</span>
      <div class="gearwrap">
        <button id="viewBtn" class="tbtn" aria-expanded="false" aria-haspopup="true">⚙ View</button>
        <div id="viewPop" class="pop" role="menu">
          <div class="pop-hd">View</div>
          <div class="pop-row"><span class="pi">🕓</span>Last trick<button class="switch" id="lastTrickSw" role="switch" aria-checked="true" aria-label="Last-trick recap"></button></div>
          <div class="pop-row"><span class="pi">🃏</span>Cheat sheet<button class="switch" id="cheatSw" role="switch" aria-checked="true" aria-label="Card cheat sheet"></button></div>
          <div class="pop-sep"></div>
          <div class="pop-hd">Bots</div>
          <button class="pop-act" id="botLvlBtn" role="menuitem"><span class="pi">🤖</span>Bot levels</button>
          <div class="pop-sep"></div>
          <div class="pop-hd">Debug</div>
          <button class="pop-act" id="exportBtn" role="menuitem"><span class="pi">🐞</span>Export game log</button>
          <div class="pop-sep"></div>
          <div class="pop-hd">Theme</div>
          <button class="theme-opt" data-theme="a" role="menuitemradio" aria-checked="true"><span class="sw" style="background:linear-gradient(135deg,#0b6b3a,#e8c766)"></span>Grand Casino<span class="chk">✓</span></button>
          <button class="theme-opt" data-theme="b" role="menuitemradio" aria-checked="false"><span class="sw" style="background:linear-gradient(135deg,#6b4a2b,#f3e9d2)"></span>Bruine Kroeg<span class="chk">✓</span></button>
          <button class="theme-opt" data-theme="c" role="menuitemradio" aria-checked="false"><span class="sw" style="background:linear-gradient(135deg,#12161c,#e7c877)"></span>Dark Mode<span class="chk">✓</span></button>
        </div>
      </div>
      <button id="leaveBtn" class="tbtn">Leave</button>
      <div id="trumpBadge"><span class="teamtag">TRUMP</span><span id="trumpSym">–</span></div>
    </div>
    <div id="table">
      <div id="toast"></div>
      <div class="seat" id="sp-2"></div>
      <div class="seat" id="sp-1"></div>
      <div class="seat" id="sp-3"></div>
      <div id="slots"><div class="tslot pos-0"></div><div class="tslot pos-1"></div><div class="tslot pos-2"></div><div class="tslot pos-3"></div></div>
      <div id="trick"></div>
      <div id="lasttrick" class="empty"></div>
      <div id="cheat">
        <div class="cheat-hd">Card cheat sheet<span class="x" id="cheatClose">✕</span></div>
        <div class="cheat-row"><span class="lbl tr" id="cheatTrumpLbl">Trump</span><div class="tiles" id="cheatTrump"></div></div>
        <div class="cheat-row"><span class="lbl">Plain</span><div class="tiles" id="cheatPlain"></div></div>
        <div class="cheat-arrow">◀ strongest · weakest ▶ &nbsp;·&nbsp; small numbers = card points</div>
        <div class="cheat-roem"><b>Roem</b> run3 <b>20</b> · run4 <b>50</b> · stuk K+Q <b>20</b> · 4×J <b>200</b> · 4×Q/K/A <b>100</b> · last trick <b>10</b> · pit <b>100</b></div>
      </div>
      <div class="seat" id="sp-0"></div>
    </div>
    <div id="linkbar" role="status"></div>
    <div id="handbar">
      <div id="handlabel"></div>
      <div id="roemcall"></div>
      <div id="hand"></div>
    </div>
  </div>
  <div id="side">
    <h1>Klaverjassen<small>Amsterdam rules · play with friends</small></h1>
    <div id="log"></div>
    <button id="rulesbtn">📖 Rules &amp; obligations</button>
  </div>
</div>

<script src="lib/peerjs.min.js"></script>
<script src="lib/engine.js"></script>
<script src="lib/game-room.js"></script>
<script src="net.js"></script>
<script>
const SUIT_SYM={clubs:'♣',diamonds:'♦',hearts:'♥',spades:'♠'};
const SUIT_RED={clubs:false,spades:false,diamonds:true,hearts:true};
const SUITS=['clubs','diamonds','hearts','spades'];
const TRUMP_VAL={J:20,9:14,A:11,'10':10,K:4,Q:3,8:0,7:0};
const PLAIN_VAL={A:11,'10':10,K:4,Q:3,J:2,9:0,8:0,7:0};
const CHEAT_TRUMP=['J','9','A','10','K','Q','8','7'];
const CHEAT_PLAIN=['A','10','K','Q','J','9','8','7'];
const TEAM_LBL=['North/South','East/West'];

/* identity */
let playerId=localStorage.getItem('kj_pid');
if(!playerId){ playerId='p_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('kj_pid',playerId); }
let seatToken=localStorage.getItem('kj_token')||null;   // proves seat ownership on reconnect
let myName=localStorage.getItem('kj_name')||'';

let st=null;                       // latest game state
let lastTrick=null;                // {cards:[{seat,card}], winner} snapshot for bottom-right recap
let showLastTrick=localStorage.getItem('kj_lasttrick')!=='0';   // last-trick recap visible by default
let showCheat=localStorage.getItem('kj_cheat')!=='0';          // cheat sheet visible by default
let net=null;                      // active transport (solo / host / client)

// winner seat of a completed 4-card trick (rank strength from CHEAT_* orders; index 0 = strongest)
function trickWinnerSeat(trick,trump){
  const led=trick[0].card.suit; let bi=0,bs=-2;
  trick.forEach((t,i)=>{
    const c=t.card;
    const sc = c.suit===trump ? 100-CHEAT_TRUMP.indexOf(c.rank)
             : c.suit===led   ? 10-CHEAT_PLAIN.indexOf(c.rank)
             : -1;
    if(sc>bs){bs=sc;bi=i;}
  });
  return trick[bi].seat;
}
let myDiff=localStorage.getItem('kj_diff')||'normal';
const LEVELS=['easy','normal','hard','family'], cap=l=>l[0].toUpperCase()+l.slice(1);
// per-seat bot level for new tables (null = same as "Bot difficulty"); index = seat (0 South … 3 East)
let mySeatDiff=(()=>{ try{ const a=JSON.parse(localStorage.getItem('kj_seatdiff')); if(Array.isArray(a)&&a.length===4) return a.map(l=>LEVELS.includes(l)?l:null); }catch(e){} return [null,null,null,null]; })();
const saveSeatDiff=()=>localStorage.setItem('kj_seatdiff',JSON.stringify(mySeatDiff));
const lvlSelect=(seat,level,dis)=>`<select class="lvlsel" data-seat="${seat}" ${dis?'disabled':''}>${LEVELS.map(l=>`<option value="${l}" ${l===level?'selected':''}>${cap(l)}</option>`).join('')}</select>`;
let myHandRoem=localStorage.getItem('kj_handroem')==='1';   // host option: roem in hand
let myTrumpMode=localStorage.getItem('kj_trumpmode')==='draw'?'draw':'choose';   // host option: choose or draw trump
const modeBtns=(mode,dis)=>[['choose','Choose'],['draw','Draw']].map(([v,l])=>`<button class="diffbtn ${mode===v?'on':''}" data-m="${v}" ${dis?'disabled':''}>${l}</button>`).join('');
const onOffBtns=(on,dis)=>[['off','Off'],['on','On']].map(([v,l])=>`<button class="diffbtn ${(v==='on')===on?'on':''}" data-r="${v}" ${dis?'disabled':''}>${l}</button>`).join('');

// Autosave so a reload / crash / dead battery doesn't lose the table:
//   kj_save     = {role:'host'|'solo', snap}  — the full room, resumable by its host
//   kj_lastroom = {code, t}                   — the table a client last joined
const loadJSON=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const saveRoom=role=>snap=>{ try{ localStorage.setItem('kj_save',JSON.stringify({role,snap})); }catch(e){} };
function clearSaves(){ try{ localStorage.removeItem('kj_save'); localStorage.removeItem('kj_lastroom'); }catch(e){} }
const RESUME_MAX_AGE=12*3600*1000;
function resumableSave(){
  const sv=loadJSON('kj_save');
  return sv&&sv.snap&&['choosing','playing','scored'].includes(sv.snap.phase)&&Date.now()-sv.snap.savedAt<RESUME_MAX_AGE&&sv.snap.hostId===playerId?sv:null;
}
function showLink(text){ const b=document.getElementById('linkbar'); b.textContent=text||''; b.classList.toggle('show',!!text); }

// Wire a freshly-created transport to the UI. Same event names the old socket used.
function bindNet(n){
  net=n; showLink('');
  n.on('joined',({code})=>{ closeModal('welcome'); if(!n.isHost) try{ localStorage.setItem('kj_lastroom',JSON.stringify({code,t:Date.now()})); }catch(e){} });
  n.on('link',({state,attempt})=>{
    if(state==='online') showLink('');
    else if(state==='failed') showLink('⚠ Disconnected — leave and rejoin with the table code.');
    else showLink(n.isHost?'⚠ Internet lost — friends can\'t reach your table yet. Retrying…':`⚠ Connection lost — reconnecting${attempt?' (try '+attempt+')':''}… a bot plays your cards meanwhile.`);
  });
  n.on('state',(s)=>{
    if(s){
      if(s.trick&&s.trick.length===4)               // full trick just before it clears → snapshot
        lastTrick={cards:s.trick.map(p=>({seat:p.seat,card:p.card})), winner:trickWinnerSeat(s.trick,s.trump)};
      else if(s.phase==='choosing'||s.phase==='lobby') lastTrick=null;   // reset each new deal
    }
    st=s; if(s&&s.token){ seatToken=s.token; localStorage.setItem('kj_token',seatToken); } render();
  });
  n.on('error',({msg})=>toast(msg,true));
  n.on('ready',()=>{ teardownNet(); st=null; showWelcome(); });
}
function teardownNet(){ if(net){ try{net.close&&net.close();}catch(e){} net=null; } }

/* ---------- welcome: choose a mode ---------- */
function showWelcome(){
  if(document.getElementById('m-welcome')) return;
  const params=new URLSearchParams(location.search);
  const preCode=(params.get('room')||'').toUpperCase();
  const sv=resumableSave(), lr=loadJSON('kj_lastroom');
  const rejoin=!sv&&lr&&lr.code&&Date.now()-lr.t<RESUME_MAX_AGE?lr.code:null;
  const resumeHtml=sv?`<button class="btn wide" id="resumeBtn">↻ Resume your ${sv.role==='solo'?'solo game':'table '+sv.snap.code} — deal ${sv.snap.g.deal}</button>`
    :rejoin?`<button class="btn wide" id="rejoinBtn">↻ Rejoin table ${rejoin}</button>`:'';
  const ov=modal('welcome',`
    <h2>Klaverjassen</h2>
    <p>Amsterdam rules · 4 players. Empty seats are played by bots.</p>
    <div class="field"><label>Your name</label><input id="nm" maxlength="16" placeholder="e.g. Sandor" value="${escapeHtml(myName)}"></div>
    <div class="diffrow"><span class="difflbl">All bots</span><div class="diffbtns" id="wDiff">${
      ['easy','normal','hard','family'].map(l=>`<button class="diffbtn ${myDiff===l?'on':''}" data-l="${l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join('')
    }</div></div>
    <div class="diffrow"><span class="difflbl">Per bot</span><div class="seatlvls" id="wSeats">${
      [[1,'West'],[2,'North'],[3,'East']].map(([i,n])=>`<label>${n} ${lvlSelect(i,mySeatDiff[i]||myDiff)}</label>`).join('')
    }</div></div>
    <div class="diffrow"><span class="difflbl">Roem in hand</span><div class="diffbtns" id="wRoem">${onOffBtns(myHandRoem)}</div></div>
    <div class="diffrow"><span class="difflbl">Trump</span><div class="diffbtns" id="wMode">${modeBtns(myTrumpMode)}</div></div>
    ${resumeHtml}
    <button class="btn wide" id="soloBtn">🤖 Play solo — offline</button>
    <button class="btn wide" id="hostBtn">🌐 Host a game with friends</button>
    <div class="sep">or join a friend's game</div>
    <div class="row2"><input id="jc" maxlength="4" placeholder="CODE" value="${preCode}"><button class="btn sec" id="joinBtn">Join</button></div>
    <p style="font-size:11px;opacity:.6;margin-top:12px">Hosting & joining connect your phones directly (peer-to-peer). Everyone needs internet, but no server is required — keep the app open while you host.</p>
  `);
  const nm=ov.querySelector('#nm');
  const saveName=()=>{ myName=nm.value.trim()||'Player'; localStorage.setItem('kj_name',myName); };
  ov.querySelectorAll('#wDiff .diffbtn').forEach(b=>b.onclick=()=>{
    myDiff=b.dataset.l; localStorage.setItem('kj_diff',myDiff);
    ov.querySelectorAll('#wDiff .diffbtn').forEach(x=>x.classList.toggle('on',x.dataset.l===myDiff));
    mySeatDiff=[null,null,null,null]; saveSeatDiff();            // "all bots" resets the per-bot picks
    ov.querySelectorAll('#wSeats .lvlsel').forEach(x=>{ x.value=myDiff; });
  });
  ov.querySelectorAll('#wSeats .lvlsel').forEach(x=>x.onchange=()=>{ mySeatDiff[+x.dataset.seat]=x.value===myDiff?null:x.value; saveSeatDiff(); });
  ov.querySelectorAll('#wRoem .diffbtn').forEach(b=>b.onclick=()=>{
    myHandRoem=b.dataset.r==='on'; localStorage.setItem('kj_handroem',myHandRoem?'1':'0');
    ov.querySelectorAll('#wRoem .diffbtn').forEach(x=>x.classList.toggle('on',(x.dataset.r==='on')===myHandRoem));
  });
  ov.querySelectorAll('#wMode .diffbtn').forEach(b=>b.onclick=()=>{
    myTrumpMode=b.dataset.m; localStorage.setItem('kj_trumpmode',myTrumpMode);
    ov.querySelectorAll('#wMode .diffbtn').forEach(x=>x.classList.toggle('on',x.dataset.m===myTrumpMode));
  });
  ov.querySelector('#soloBtn').onclick=()=>{ saveName(); teardownNet(); clearSaves(); bindNet(KJNet.createSolo({playerId,name:myName,botLevel:myDiff,seatLevels:mySeatDiff,handRoem:myHandRoem,trumpMode:myTrumpMode,onSave:saveRoom('solo')})); };
  ov.querySelector('#hostBtn').onclick=()=>{ saveName(); teardownNet(); clearSaves(); toast('Creating your table…'); bindNet(KJNet.createHost({playerId,name:myName,botLevel:myDiff,seatLevels:mySeatDiff,handRoem:myHandRoem,trumpMode:myTrumpMode,onSave:saveRoom('host')})); };
  const join=c=>{ saveName(); teardownNet(); toast('Connecting to '+c+'…'); bindNet(KJNet.createClient({playerId,name:myName,code:c,getToken:()=>seatToken})); };
  ov.querySelector('#joinBtn').onclick=()=>{ const c=ov.querySelector('#jc').value.trim().toUpperCase(); if(c.length<4)return toast('Enter a 4-letter code',true); join(c); };
  const rb=ov.querySelector('#rejoinBtn'); if(rb) rb.onclick=()=>join(rejoin);
  const sb=ov.querySelector('#resumeBtn'); if(sb) sb.onclick=()=>{
    saveName(); teardownNet();
    if(sv.role==='solo') bindNet(KJNet.createSolo({playerId,resume:sv.snap,onSave:saveRoom('solo')}));
    else { toast('Reopening table '+sv.snap.code+'…'); bindNet(KJNet.createHost({playerId,resume:sv.snap,onSave:saveRoom('host')})); }
  };
  ov.querySelector('#jc').addEventListener('keydown',e=>{ if(e.key==='Enter')ov.querySelector('#joinBtn').click(); });
  nm.focus();
  if(preCode.length===4) setTimeout(()=>toast('Code '+preCode+' ready — enter your name and Join'),300);
}
document.addEventListener('DOMContentLoaded',showWelcome);

/* ---------- rendering ---------- */
function seatPos(seat){ const my=(st.mySeat<0?0:st.mySeat); return (seat-my+4)%4; }

function render(){
  if(!st){ return; }
  document.getElementById('roomPill').textContent='Table '+st.code;
  const myTeam=(st.mySeat<0?0:st.mySeat)%2;
  document.getElementById('weLbl').innerHTML='We <span class="tm">('+TEAM_LBL[myTeam]+')</span>';
  document.getElementById('theyLbl').innerHTML='They <span class="tm">('+TEAM_LBL[1-myTeam]+')</span>';
  const cum=st.cumulative||[0,0];
  document.getElementById('scoreWe').textContent=cum[myTeam];
  document.getElementById('scoreThey').textContent=cum[1-myTeam];
  const dp=document.getElementById('dealPill');
  if(st.deal){ dp.style.display=''; document.getElementById('dealNo').textContent=st.deal; } else dp.style.display='none';
  const tsym=document.getElementById('trumpSym');
  const shown=st.trump||(st.bid&&st.bid.suit);      // draw mode: the suit on offer, marked '?'
  tsym.textContent=shown?SUIT_SYM[shown]+(st.trump?'':'?'):'–';
  tsym.style.color=shown&&SUIT_RED[shown]?'#ff7b7b':'#eaf3ec';

  renderSeats();
  renderTrick();
  renderHand();
  renderLog();
  renderCheat();
  handleModals();
}

function renderSeats(){
  for(let pos=0;pos<4;pos++) document.getElementById('sp-'+pos).innerHTML='';
  const showBacks = st.phase!=='lobby';
  for(const s of st.seats){
    const pos=seatPos(s.seat);
    const el=document.getElementById('sp-'+pos);
    el.className='seat'+(st.turn===s.seat&&st.phase==='playing'?' turn':'')+(st.dealer===s.seat?' dealer':'')+((s.present&&!s.connected&&!s.isBot)?' off':'');
    const meTag = s.seat===st.mySeat?' (you)':'';
    const teamName = s.team===((st.mySeat<0?0:st.mySeat)%2)?'we':'they';
    let inner='';
    if(pos!==0 && showBacks){
      const backs=Array.from({length:s.cardCount},()=>'<div class="cardback"></div>').join('');
      const vert=(pos===1||pos===3)?' vert':'';
      inner+=`<div class="backrow${vert}">${backs}</div>`;
    }
    const nm=`<div class="name">${escapeHtml(s.name)}${meTag}${s.isBot?' 🤖':''}</div>`;
    const tag=`<div class="teamtag ${teamName}">${TEAM_LBL[s.team]}${s.isBot&&st.phase!=='lobby'?' · '+cap(s.level):''}${s.present&&!s.connected&&!s.isBot?' · away':''}</div>`;
    inner = (pos===2)? nm+tag+inner : (pos===0? nm+tag : inner+nm+tag);
    el.innerHTML=inner;
  }
}

function cardEl(card,cls){
  const el=document.createElement('div');
  el.className='card '+(SUIT_RED[card.suit]?'red':'')+(cls?' '+cls:'');
  const sym=SUIT_SYM[card.suit];
  el.innerHTML=`<span class="rk">${card.rank}${sym}</span><span class="big">${sym}</span><span class="rk b">${card.rank}${sym}</span>`;
  return el;
}
function renderTrick(){
  const t=document.getElementById('trick'); t.innerHTML='';
  document.getElementById('slots').style.display=(st.phase==='playing')?'block':'none';
  if(!st.trick) return;
  for(const p of st.trick){
    const mine=p.seat===st.mySeat;
    t.appendChild(cardEl(p.card,'tcard pos-'+seatPos(p.seat)+(mine?' mine':'')));
  }
  renderLastTrick();
}
function renderLastTrick(){
  const el=document.getElementById('lasttrick'); el.innerHTML='';
  if(!showLastTrick||!lastTrick||!lastTrick.cards.length){ el.classList.add('empty'); return; }
  el.classList.remove('empty');
  const lbl=document.createElement('div'); lbl.className='ltlbl'; lbl.textContent='Last trick'; el.appendChild(lbl);
  for(const p of lastTrick.cards){                 // same viewer-relative orientation as the middle
    const c=document.createElement('div');
    c.className='ltcard lt-'+seatPos(p.seat)+(SUIT_RED[p.card.suit]?' red':'')+(p.seat===lastTrick.winner?' ltwin':'');
    c.textContent=p.card.rank+SUIT_SYM[p.card.suit];
    el.appendChild(c);
  }
}
function renderHand(){
  const handEl=document.getElementById('hand'); handEl.innerHTML='';
  const label=document.getElementById('handlabel');
  const legal=new Set(st.legal||[]);
  const myTurn = st.phase==='playing' && st.turn===st.mySeat && !st.resolving;
  for(const card of (st.hand||[])){
    const isLegal=legal.has(card.id);
    const el=cardEl(card, myTurn?(isLegal?'legal':'illegal'):'');
    if(myTurn&&isLegal) el.onclick=()=>net.emit('play',{cardId:card.id});
    handEl.appendChild(el);
  }
  label.textContent=statusLine();
  const rc=document.getElementById('roemcall'); rc.innerHTML='';
  const r=st.myRoem;
  if(r&&r.canCall){
    const b=document.createElement('button'); b.className='btn';
    b.textContent=`📣 Call roem +${r.roem}`; b.title=r.labels.join(', ');
    b.onclick=()=>net.emit('callRoem');
    rc.appendChild(b);
  }
}
function statusLine(){
  if(!st) return '';
  if(st.phase==='lobby') return 'Waiting in the lobby…';
  if(st.phase==='choosing'&&st.bid) return st.needBid?`${SUIT_SYM[st.bid.suit]} drawn — play or pass?`:`${SUIT_SYM[st.bid.suit]} drawn — ${nmeat(st.bid.turn)} to play or pass…`;
  if(st.phase==='choosing') return st.mySeat===st.chooser?'Choose a trump suit…':`Waiting for ${nmeat(st.chooser)} to choose trump…`;
  if(st.phase==='playing'){
    if(st.resolving) return 'Trick complete…';
    if(st.turn===st.mySeat) return obligation();
    return `${nmeat(st.turn)} to play…`;
  }
  return '';
}
function nmeat(seat){ const s=st.seats.find(x=>x.seat===seat); return s?s.name:''; }
function obligation(){
  if(!st.trick.length) return 'Your lead — play any card.';
  const led=st.trick[0].card.suit, tr=st.trump;
  const hand=st.hand||[];
  const haveLed=hand.some(c=>c.suit===led);
  if(led===tr) return haveLed?'Trump led — follow & overtrump if you can.':'Trump led — you hold none, play anything.';
  if(haveLed) return 'Follow suit ('+SUIT_SYM[led]+').';
  if(hand.some(c=>c.suit===tr)){
    const trumped=st.trick.some(p=>p.card.suit===tr);
    if(trickWinnerSeat(st.trick,tr)===(st.mySeat+2)%4) return trumped?'Void, partner is winning — no need to trump (no undertrumping).':'Void, partner is winning — play anything.';
    if(!trumped) return 'Void — you must trump in.';
    return (st.legal||[]).some(id=>id.startsWith(tr))?'Void — you must overtrump.':'Void, cannot overtrump — play another suit (no undertrumping).';
  }
  return 'Void of suit & trump — discard anything.';
}
function renderLog(){
  const l=document.getElementById('log'); l.innerHTML='';
  for(const e of (st.log||[])){ const d=document.createElement('div'); d.className='entry'+(e.cls?' '+e.cls:''); d.innerHTML=e.html; l.appendChild(d); }
  l.scrollTop=l.scrollHeight;
}

/* ---------- modals: lobby / trump / deal / match ---------- */
let openOverlays={};
function handleModals(){
  // clear game modals not relevant
  if(st.phase!=='choosing') closeModal('trump');
  if(!st.needBid) closeModal('bid');
  if(st.phase!=='scored'&&st.phase!=='matchover') closeModal('deal');
  if(st.phase!=='matchover') statsRecorded=false;   // arm stats recording for the next match

  if(st.phase==='lobby') renderLobbyModal(); else closeModal('lobby');
  if(st.phase==='choosing'&&st.needTrump) renderTrumpModal();
  if(st.needBid) renderBidModal();
  if(st.phase==='scored'||st.phase==='matchover') renderDealModal();
}
function renderLobbyModal(){
  const ov=modal('lobby','',true);
  const iAmHost = st.seats.some(s=>s.seat===st.mySeat&&s.isHost);
  const seatCards=[0,1,2,3].map(seat=>{
    const s=st.seats.find(x=>x.seat===seat);
    const mine=seat===st.mySeat;
    const taken=s.present;
    const who = taken? escapeHtml(s.name)+(s.isHost?' 👑':'')+(mine?' (you)':'') : 'Open — click to sit';
    const lvl = taken&&!s.isBot ? '' : `<div class="lvl">🤖 Bot ${iAmHost?lvlSelect(seat,s.level):'<b>'+cap(s.level)+'</b>'}</div>`;
    return `<div class="lseat t${seat%2} ${mine?'mine':''} ${taken?'taken':''}" data-seat="${seat}">
      <div class="pos">${['South','West','North','East'][seat]} · ${TEAM_LBL[seat%2]}</div>
      <div class="who">${who}</div>${lvl}</div>`;
  }).join('');
  ov.querySelector('.modal').innerHTML=`
    <h2>Table lobby</h2>
    <p>Share this code so friends can join (they tap <b>Join</b> and enter it). North &amp; South are partners; East &amp; West are partners.</p>
    <div class="codebig">${st.code}</div>
    <button class="btn sec" id="copyLink">📋 Copy table code</button>
    <div class="lobbyseats">${seatCards}</div>
    <div class="diffrow"><span class="difflbl">All bots</span><div class="diffbtns">${
      LEVELS.map(l=>`<button class="diffbtn ${st.botLevel===l?'on':''}" data-l="${l}" ${iAmHost?'':'disabled'}>${cap(l)}</button>`).join('')
    }</div></div>
    <div class="diffrow"><span class="difflbl">Roem in hand</span><div class="diffbtns" id="lRoem">${onOffBtns(!!st.handRoem,!iAmHost)}</div></div>
    <div class="diffrow"><span class="difflbl">Trump</span><div class="diffbtns" id="lMode">${modeBtns(st.trumpMode||'choose',!iAmHost)}</div></div>
    <p style="margin:6px 0 12px">${iAmHost?'Empty seats become bots when you start.':'Waiting for the host to start…'}</p>
    ${iAmHost?'<button class="btn wide" id="startBtn">Start match ▶</button>':''}
  `;
  ov.querySelectorAll('.lseat').forEach(el=>el.onclick=e=>{ if(e.target.closest('.lvlsel')) return; const seat=+el.dataset.seat; if(seat!==st.mySeat) net.emit('claimSeat',{seat}); });
  ov.querySelectorAll('.lseat .lvlsel').forEach(x=>x.onchange=()=>emitSeatLevel(+x.dataset.seat,x.value));
  ov.querySelectorAll('.diffbtn[data-l]').forEach(b=>b.onclick=()=>{ if(iAmHost) net.emit('setDifficulty',{level:b.dataset.l}); });
  ov.querySelectorAll('#lMode .diffbtn').forEach(b=>b.onclick=()=>{ if(iAmHost){ myTrumpMode=b.dataset.m; localStorage.setItem('kj_trumpmode',myTrumpMode); net.emit('setTrumpMode',{mode:myTrumpMode}); } });
  ov.querySelectorAll('#lRoem .diffbtn').forEach(b=>b.onclick=()=>{ if(iAmHost){ myHandRoem=b.dataset.r==='on'; localStorage.setItem('kj_handroem',myHandRoem?'1':'0'); net.emit('setHandRoem',{on:myHandRoem}); } });
  ov.querySelector('#copyLink').onclick=()=>{ const code=st.code; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(()=>toast('Code '+code+' copied — share it!'),()=>toast('Share code: '+code)); } else toast('Share code: '+code); };
  const sb=ov.querySelector('#startBtn'); if(sb) sb.onclick=()=>net.emit('start');
}
function renderTrumpModal(){
  if(openOverlays['trump']) return;

  const ov=modal('trump',`<h2>Choose trump</h2>
    <p>You sit left of the dealer, so you name trump — your team must then score <b>more than</b> the opponents, or go <b>nat</b>. Check the cheat sheet (bottom-left).</p>
    <div class="suitbtns">${SUITS.map(s=>`<button class="suitbtn ${SUIT_RED[s]?'red':'black'}" data-s="${s}">${SUIT_SYM[s]}</button>`).join('')}</div>`);
  ov.querySelectorAll('.suitbtn').forEach(b=>b.onclick=()=>{ net.emit('chooseTrump',{suit:b.dataset.s}); closeModal('trump'); });
}
function renderBidModal(){
  if(openOverlays['bid']) return;
  setCheat(true,false);
  const su=st.bid.suit, first=st.chooser===st.mySeat;
  const ov=modal('bid',`<h2>Trump drawn</h2>
    <div class="suitbtns"><div class="suitbtn ${SUIT_RED[su]?'red':'black'}" style="cursor:default">${SUIT_SYM[su]}</div></div>
    <p>Play on ${SUIT_SYM[su]} and your team must score <b>more than</b> the opponents, or go <b>nat</b>.
      ${first?'You lead the first card either way.':`${escapeHtml(nmeat(st.chooser))} still leads the first card.`}

/* ---------- solo stats (persisted per browser; solo mode only) ---------- */
const STATS_KEY='kj_stats';
let statsRecorded=false;                              // one record per match
function blankStats(){ return {games:0,wins:0,losses:0,ties:0,pf:0,pa:0,streak:0,bestStreak:0,byLevel:{}}; }
function loadStats(){ try{ return Object.assign(blankStats(),JSON.parse(localStorage.getItem(STATS_KEY))||{}); }catch(e){ return blankStats(); } }
// solo record is kept per bot level; a table with bots on different levels counts as "mixed"
function statsLevel(){
  const lv=st?st.seats.filter(x=>x.isBot).map(x=>x.level):[];
  return !lv.length?myDiff:lv.every(l=>l===lv[0])?lv[0]:'mixed';
}
function recordSoloResult(we,they){
  const s=loadStats();
  s.games++; s.pf+=we; s.pa+=they;
  if(we>they){ s.wins++;   s.streak=s.streak>0?s.streak+1:1; }
  else if(we<they){ s.losses++; s.streak=s.streak<0?s.streak-1:-1; }
  else { s.ties++; s.streak=0; }
  s.bestStreak=Math.max(s.bestStreak,s.streak);
  const lv=statsLevel(), bl=s.byLevel[lv]||{games:0,wins:0}; bl.games++; if(we>they) bl.wins++; s.byLevel[lv]=bl;
  try{ localStorage.setItem(STATS_KEY,JSON.stringify(s)); }catch(e){}
  return s;
}
function statsHtml(s){
  if(!s||!s.games) return '';
  const pct=Math.round(100*s.wins/s.games);
  const streakTxt=s.streak>0?`${s.streak}-win streak 🔥`:s.streak<0?`${-s.streak}-loss streak`:'—';
  const lv=statsLevel(), bl=s.byLevel[lv]; const blTxt=bl&&bl.games?` · vs ${lv}: ${bl.wins}/${bl.games}`:'';
  return `<div class="summary" style="margin-top:10px">
    <div class="row big"><span>Your record vs bots</span><span>${s.wins}–${s.losses}${s.ties?'–'+s.ties:''} (${pct}%)</span></div>
    <div class="row" style="opacity:.7;font-size:12px"><span>${s.games} matches · ${streakTxt} · best ${s.bestStreak}W${blTxt}</span><span></span></div>
  </div>`;
}
function renderDealModal(){
  if(openOverlays['deal']) return;
  const r=st.lastResult; if(!r) return;
  const done=st.phase==='matchover';
  const myTeam=(st.mySeat<0?0:st.mySeat)%2;
  const teamWord=t=>t===myTeam?'we':'they';
  const line=(lbl,cls,val)=>`<div class="row"><span class="${cls}">${lbl}</span><span>${val}</span></div>`;
  let matchHtml='';
  if(done){
    const weSc=r.cumulative[myTeam], theySc=r.cumulative[1-myTeam];
    const res= weSc>theySc?'<span class="win">Your team wins! 🏆</span>':weSc<theySc?'<span class="lose">Your team loses.</span>':'A tie!';
    let stats=null;
    if(net&&net.solo&&!statsRecorded){ statsRecorded=true; stats=recordSoloResult(weSc,theySc); }
    matchHtml=`<p style="font-size:16px;font-weight:800">Final — We ${weSc} : They ${theySc}<br>${res}</p>`+statsHtml(stats);
  }
  const ov=modal('deal',`
    <h2>Deal ${r.deal} ${r.nat?'— NAT':'complete'}</h2>
    <div class="summary">
      ${line(`${TEAM_LBL[r.play]} (declared ${SUIT_SYM[r.trump]})`,teamWord(r.play),r.playPts+' pts')}
      ${line(`${TEAM_LBL[r.opp]}`,teamWord(r.opp),r.oppPts+' pts')}
      <div class="row" style="opacity:.7;font-size:12px"><span>roem this deal</span><span>${r.totalRoem}</span></div>
      ${(r.pitPlay||r.pitOpp)?`<div class="row"><span class="win">PIT +100</span><span>${TEAM_LBL[r.pitPlay?r.play:r.opp]}</span></div>`:''}
      <hr style="border-color:#ffffff22">
      <div class="row big"><span class="${teamWord(myTeam)}">We total</span><span>${r.cumulative[myTeam]}</span></div>
      <div class="row big"><span class="${teamWord(1-myTeam)}">They total</span><span>${r.cumulative[1-myTeam]}</span></div>
    </div>
    ${matchHtml}
    ${done?'<button class="btn" id="againBtn">New match</button>':'<button class="btn" id="nextBtn">Next deal ▶</button><p style="margin-top:10px;font-size:11px;opacity:.6">auto-continues shortly…</p>'}
  `);
  const nx=ov.querySelector('#nextBtn'); if(nx) nx.onclick=()=>{ net.emit('next'); closeModal('deal'); };
  const ag=ov.querySelector('#againBtn'); if(ag) ag.onclick=()=>net.emit('newMatch');
}

/* ---------- cheat sheet ---------- */
function buildTiles(el,order,valMap,suit){
  el.innerHTML='';
  for(const r of order){ const v=valMap[r]; const t=document.createElement('div');
    t.className='tile'+(suit&&SUIT_RED[suit]?' red':'')+(v===0?' zero':'');
    t.innerHTML=`<span class="r">${r}${suit?SUIT_SYM[suit]:''}</span><span class="v">${v}</span>`; el.appendChild(t); }
}
function renderCheat(){
  const tr=st?st.trump:null;
  document.getElementById('cheatTrumpLbl').innerHTML=tr?('Trump '+SUIT_SYM[tr]):'Trump';
  buildTiles(document.getElementById('cheatTrump'),CHEAT_TRUMP,TRUMP_VAL,tr);
  buildTiles(document.getElementById('cheatPlain'),CHEAT_PLAIN,PLAIN_VAL,null);
}
/* ---------- view menu (gear popover): cheat sheet + last-trick toggles ---------- */
const viewBtn=document.getElementById('viewBtn'), viewPop=document.getElementById('viewPop');
const cheatSw=document.getElementById('cheatSw'), lastTrickSw=document.getElementById('lastTrickSw');
function openView(open){ viewPop.classList.toggle('open',open); viewBtn.setAttribute('aria-expanded',open); viewBtn.classList.toggle('on',open); }
viewBtn.onclick=e=>{ e.stopPropagation(); openView(!viewPop.classList.contains('open')); };

/* debug export: the host (or solo player) owns the room, so it can dump every deal */
// host: change one bot's level, before or during a match (takes effect on its next move)
function emitSeatLevel(seat,level){ if(net) net.emit('setSeatLevel',{seat,level:level===st.botLevel?null:level}); }
function renderBotLevels(){
  const bots=st.seats.filter(x=>x.isBot);
  const ov=modal('levels',`<h2>Bot levels</h2>
    <p>Takes effect from the bot's next move.</p>
    ${bots.map(x=>`<div class="diffrow"><span class="difflbl">${['South','West','North','East'][x.seat]} · ${escapeHtml(x.name)}</span>${lvlSelect(x.seat,x.level)}</div>`).join('')||'<p>No bots at this table.</p>'}
    <button class="btn wide" id="lvlDone" style="margin-top:12px">Done</button>`);
  ov.querySelectorAll('.lvlsel').forEach(x=>x.onchange=()=>emitSeatLevel(+x.dataset.seat,x.value));
  ov.querySelector('#lvlDone').onclick=()=>closeModal('levels');
}
document.getElementById('botLvlBtn').onclick=()=>{
  openView(false);
  if(!net||!st) return toast('Start a game first.',true);
  if(!net.isHost) return toast('Only the host can change the bots.',true);
  if(st.phase==='lobby') return toast('Set the bots on the seat cards in the lobby.');
  renderBotLevels();
};
document.getElementById('exportBtn').onclick=async()=>{
  openView(false);
  if(!net||!net.room) return toast(net?'Only the host can export — ask them to.':'Start or join a game first.',true);
  const data=net.room.export({ client:{ userAgent:navigator.userAgent, url:location.href, native:!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()) } });
  const text=JSON.stringify(data,null,1);
  const stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  const fname=`klaverjassen-${data.code}-${stamp}.json`;
  if(!data.client.native){                         // browsers: save a file
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('Saved '+fname); return;
  }
  try{ await navigator.clipboard.writeText(text); toast('Game log copied — paste it into a message or file'); }   // Android app: no downloads in the WebView
  catch(e){ toast('Could not copy the log on this device',true); }
};
// phones kill the link when the app is backgrounded — retry right away on return
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&net&&net.reconnectNow) net.reconnectNow(); });
document.addEventListener('click',e=>{ if(!viewPop.contains(e.target)&&e.target!==viewBtn) openView(false); });
function setCheat(on,persist=true){ showCheat=on; if(persist) localStorage.setItem('kj_cheat',on?'1':'0'); document.getElementById('cheat').classList.toggle('hidden',!on); cheatSw.setAttribute('aria-checked',on); }
function setLastTrick(on){ showLastTrick=on; localStorage.setItem('kj_lasttrick',on?'1':'0'); lastTrickSw.setAttribute('aria-checked',on); renderLastTrick(); }
cheatSw.onclick=e=>{ e.stopPropagation(); setCheat(cheatSw.getAttribute('aria-checked')!=='true'); };
lastTrickSw.onclick=e=>{ e.stopPropagation(); setLastTrick(lastTrickSw.getAttribute('aria-checked')!=='true'); };
[cheatSw,lastTrickSw].forEach(s=>s.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); s.click(); } }));
lastTrickSw.setAttribute('aria-checked',showLastTrick);   // reflect persisted state
setCheat(showCheat);                                      // reflect persisted state
document.getElementById('cheatClose').onclick=()=>setCheat(false);
/* ---------- theme picker (Grand Casino / Bruine Kroeg / Dark Mode) ---------- */
const THEME_NAME={a:'Grand Casino',b:'Bruine Kroeg',c:'Dark Mode'};
const THEME_BAR={a:'#0a5730',b:'#2b2018',c:'#12161c'};   // mobile status-bar tint
let theme=localStorage.getItem('kj_theme')||'a';
if(!THEME_NAME[theme]) theme='a';   // fall back if an unknown/legacy id was stored
function applyTheme(t,announce){
  theme=t;
  if(t==='a') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('kj_theme',t);
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content',THEME_BAR[t]);
  document.querySelectorAll('.theme-opt').forEach(o=>o.setAttribute('aria-checked',o.dataset.theme===t));
  if(announce && typeof toast==='function') toast('Theme: '+THEME_NAME[t]);
}
document.querySelectorAll('.theme-opt').forEach(o=>o.onclick=e=>{ e.stopPropagation(); applyTheme(o.dataset.theme,true); });
applyTheme(theme);
document.getElementById('leaveBtn').onclick=()=>{ if(confirm('Leave this table?')){ clearSaves(); net.emit('leave'); history.replaceState(null,'','/'); } };

/* rules modal */
document.getElementById('rulesbtn').onclick=()=>{
  const ov=modal('rules',`<div style="max-width:560px"><h2>Amsterdam Klaverjassen</h2><div id="ruleText">
    <h3>The Amsterdam obligations</h3>
    <b>1.</b> Follow the led suit if you can.<br>
    <b>2.</b> If you can't and <b>your partner is winning the trick</b>, you may play <b>any card</b> (the signature Amsterdam rule).<br>
    <b>3.</b> Otherwise you <b>must trump</b>; with a trump already down you <b>must overtrump</b> if able.<br>
    <b>4.</b> You may <b>never undertrump</b>: if you can't overtrump, play a card of another suit. A lower trump is only allowed when you hold nothing but trumps.<br>
    <b>5.</b> When trump is led you must follow and play higher if able.
    <h3>Card values</h3>
    <table class="vt"><tr><td><b>Trump</b></td><td>J 20</td><td>9 14</td><td>A 11</td><td>10 10</td><td>K 4</td><td>Q 3</td><td>8/7 0</td></tr>
    <tr><td><b>Plain</b></td><td>A 11</td><td>10 10</td><td>K 4</td><td>Q 3</td><td>J 2</td><td colspan="2">9/8/7 0</td></tr></table>
    152 + 10 last trick = <b>162</b> per deal.
    <h3>Roem</h3>run3 20 · run4 50 · <b>stuk</b> (trump K+Q) 20 · run incl. trump K-Q 40/70 · four Jacks 200 · four Queens/Kings/Aces 100. To the team winning the trick.
    <br><b>Roem in hand</b> (host option): runs in your own hand (3 = 20, 4 = 50, 5+ = 100), four of a kind (J 200, Q/K/A 100) and stuk score for your team — but only if you <b>call</b> it before playing your first card.
    <h3>Trump</h3><b>Choose</b> (default): the player left of the dealer names trump. <b>Draw</b> (host option): a random suit is drawn and offered round the table, starting with the player left of the dealer; each may <b>play</b> on it (their team must then win, or go nat) or <b>pass</b>. If all four pass, a different suit is drawn and the first player must play it. The first player always leads the first card.
    <h3>Winning</h3>The declaring team must score <b>more than</b> the opponents (points + roem), else they go <b>nat</b> and the opponents take all 162 + all roem. All 8 tricks = <b>pit</b> (+100).
    <h3>Match</h3>16 deals; highest total wins.
    </div><br><button class="btn sec" id="closeRules">Close</button></div>`);
  ov.querySelector('#closeRules').onclick=()=>closeModal('rules');
};

/* ---------- modal + toast utilities ---------- */
function modal(key,inner,persistent){
  if(openOverlays[key]) { if(inner) openOverlays[key].querySelector('.modal').innerHTML=inner; return openOverlays[key]; }
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='m-'+key;
  ov.innerHTML=`<div class="modal">${inner}</div>`;
  document.getElementById('table').appendChild(ov);
  openOverlays[key]=ov; return ov;
}
function closeModal(key){ if(openOverlays[key]){ openOverlays[key].remove(); delete openOverlays[key]; } }
let toastT=null;
function toast(msg,err){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='',err?2600:1600); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

renderCheat();
